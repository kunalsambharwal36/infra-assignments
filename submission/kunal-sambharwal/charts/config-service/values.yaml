---
namespace: config-service

replicaCount: 1

image:
  repository: config-service
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

postgres:
  image:
    repository: postgres
    tag: "16"

  database: configdb
  username: postgres
  password: postgres
  port: 5432
  storage: 1Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi