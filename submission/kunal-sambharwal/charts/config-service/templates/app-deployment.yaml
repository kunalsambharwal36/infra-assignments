---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{include "config-service.fullname" .}}
  namespace: {{.Values.namespace}}

spec:
  replicas: {{.Values.replicaCount}}

  selector:
    matchLabels:
      app: {{include "config-service.fullname" .}}

  template:
    metadata:
      labels:
        app: {{include "config-service.fullname" .}}

    spec:
      containers:
        - name: config-service
          image: "{{.Values.image.repository}}:{{.Values.image.tag}}"
          imagePullPolicy: {{.Values.image.pullPolicy}}

          ports:
            - containerPort: {{.Values.service.port}}

          envFrom:
            - configMapRef:
                name: {{include "config-service.fullname" .}}-config
            - secretRef:
                name: {{include "config-service.fullname" .}}-secret

          resources:
{{ toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /ping
              port: {{.Values.service.port}}
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /ping
              port: {{.Values.service.port}}
            initialDelaySeconds: 5
            periodSeconds: 5