---
apiVersion: v1
kind: Service

metadata:
  name: {{include "config-service.fullname" .}}
  namespace: {{.Values.namespace}}

spec:
  type: {{.Values.service.type}}

  selector:
    app: {{include "config-service.fullname" .}}

  ports:
    - port: {{.Values.service.port}}
      targetPort: {{.Values.service.port}}